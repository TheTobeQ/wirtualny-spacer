<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Spacer po nieruchomości</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1c20;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#topbar{position:absolute;top:14px;left:14px;z-index:10;background:rgba(20,24,30,.88);backdrop-filter:blur(10px);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.35;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#topbar strong{display:block;font-size:14px;margin-bottom:2px}
#topbar span{opacity:.7;font-size:12px}
#modes{position:absolute;top:14px;right:14px;z-index:10;display:flex;gap:6px;background:rgba(20,24,30,.88);backdrop-filter:blur(10px);padding:5px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#modes button{border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.65)}
#modes button.active{background:#e8d5b5;color:#1a1a1a}
#panel{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;background:rgba(18,22,28,.92);backdrop-filter:blur(12px);color:#eee;padding:18px 22px;border-radius:16px;text-align:center;max-width:min(420px,92vw);box-shadow:0 8px 32px rgba(0,0,0,.4)}
#panel p{font-size:13px;opacity:.75;margin:8px 0 14px;line-height:1.5}
#panel .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#panel button{border:none;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
#enter{background:#7dcea0;color:#0f1a12}
#reset{background:rgba(255,255,255,.12);color:#ddd}
#loading{position:absolute;inset:0;background:#12141a;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;gap:14px;font-size:14px}
#loading .bar{width:200px;height:3px;background:#2a2e36;border-radius:2px;overflow:hidden}
#loading .fill{height:100%;width:0%;background:#7eb8ff;transition:width .12s}
#crosshair{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:1.5px solid rgba(255,255,255,.4);border-radius:50%;pointer-events:none;z-index:5;display:none}
#joy{position:absolute;left:20px;bottom:20px;width:120px;height:120px;display:none;z-index:8;touch-action:none}
#joy-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);position:relative}
#joy-knob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);top:50%;left:50%;transform:translate(-50%,-50%)}
#look{position:absolute;right:0;top:0;width:55%;height:100%;display:none;z-index:6;touch-action:none}
</style>
</head>
<body>
<div id="loading"><div>Ładowanie modelu…</div><div class="bar"><div class="fill" id="progress"></div></div></div>
<div id="topbar"><strong>Spacer po nieruchomości</strong><span id="modeLabel">Stan faktyczny · bez umeblowania</span></div>
<div id="modes"><button id="btnActual" class="active">Stan faktyczny</button><button id="btnFinished">Wykończone</button></div>
<div id="panel"><p id="hint">Rozejrzyj się myszą. Poruszaj się WASD lub strzałkami. Shift — szybciej, Esc — pauza.</p>
<div class="btns"><button id="enter">Wejdź do środka</button><button id="reset">Wróć do początku</button></div></div>
<div id="crosshair"></div>
<div id="joy"><div id="joy-base"><div id="joy-knob"></div></div></div>
<div id="look"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createFinished} from './finished.js';

const $=id=>document.getElementById(id);
const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||('ontouchstart' in window);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#bfd4e1');
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.04,300);
camera.rotation.order='YXZ';
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.35;
scene.add(new THREE.HemisphereLight(0xe6f1ff,0xc8beb0,1.65));
scene.add(new THREE.AmbientLight(0xfff5e5,.7));
const sun=new THREE.DirectionalLight(0xfff3df,3.2);
sun.position.set(-12,15,5);sun.target.position.set(0,0,-1);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:.1,far:50});
sun.shadow.normalBias=.025;sun.shadow.bias=-.0001;
scene.add(sun,sun.target);

let furnished=false,active=false,ready=false;
const keys=new Set();const clock=new THREE.Clock();
const spawn=new THREE.Vector3(-4,1.6,2.75);
const spawnQ=new THREE.Quaternion(-.0205987,-.332001,-.007252,.943026);
let finish=null;
const bounds={minX:-4.6,maxX:5.0,minZ:-5.3,maxZ:3.3};

function resetCam(){
  camera.position.copy(furnished?new THREE.Vector3(-3.2,1.6,2.65):spawn);
  camera.quaternion.copy(spawnQ);keys.clear();
}
resetCam();

function loadModel(urls,idx=0){
  if(idx>=urls.length){$('loading').innerHTML='<div style="color:#f66">Błąd ładowania modelu.</div>';return;}
  new GLTFLoader().load(urls[idx],gltf=>{
    const root=gltf.scene;
    root.traverse(o=>{
      if(o.isLight)o.visible=false;
      if(o.isMesh){
        o.castShadow=true;o.receiveShadow=true;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const m of mats){if(!m)continue;if(m.map){m.map.colorSpace=THREE.SRGBColorSpace;m.map.anisotropy=renderer.capabilities.getMaxAnisotropy();}m.side=THREE.FrontSide;m.needsUpdate=true;}
        if(o.geometry)o.geometry.computeVertexNormals();
      }
    });
    scene.add(root);
    finish=createFinished(root);
    scene.add(finish.group);
    $('progress').style.width='100%';
    setTimeout(()=>{$('loading').style.display='none';ready=true;},200);
  },xhr=>{if(xhr.total)$('progress').style.width=Math.min(97,(xhr.loaded/xhr.total)*100)+'%';},
  ()=>loadModel(urls,idx+1));
}
loadModel(['model.glb','https://tobek-spacer-stan-faktyczny.thetobeq.chatgpt.site/model.glb']);

function setMode(on){
  furnished=on;if(finish)finish.set(on);
  scene.environmentIntensity=on?.5:.35;
  renderer.toneMappingExposure=on?1.08:1.0;
  $('btnActual').classList.toggle('active',!on);
  $('btnFinished').classList.toggle('active',on);
  $('modeLabel').textContent=on?'Wykończone · propozycja aranżacji':'Stan faktyczny · bez umeblowania';
  $('hint').textContent=on?'Aranżacja inspirowana układem z filmu.':'Oryginalny model – stan deweloperski.';
  if(ready)resetCam();
}
$('btnActual').onclick=()=>setMode(false);
$('btnFinished').onclick=()=>setMode(true);

function setActive(v){
  active=v;$('panel').style.display=v?'none':'block';
  $('crosshair').style.display=v&&!isMobile?'block':'none';
  if(isMobile){$('joy').style.display=v?'block':'none';$('look').style.display=v?'block':'none';}
  if(v&&!isMobile)renderer.domElement.requestPointerLock?.();
  else if(!v&&document.pointerLockElement)document.exitPointerLock?.();
}
$('enter').onclick=()=>{if(!ready)return;setActive(true);};
$('reset').onclick=()=>resetCam();

document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==renderer.domElement&&active&&!isMobile)setActive(false);});
document.addEventListener('mousemove',e=>{
  if(!active||(document.pointerLockElement!==renderer.domElement&&!isMobile))return;
  camera.rotation.y-=e.movementX*.002;
  camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x-e.movementY*.002,-1.35,1.35);
});
document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){setActive(false);return;}
  if(active&&['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys.add(e.code);}
});
document.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();setActive(false);});

let joyActive=false,joyVec={x:0,y:0};
const knob=$('joy-knob'),joyEl=$('joy');
joyEl.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true;},{passive:false});
joyEl.addEventListener('touchmove',e=>{
  if(!joyActive)return;e.preventDefault();
  const t=e.touches[0],rect=joyEl.getBoundingClientRect();
  let dx=t.clientX-rect.left-60,dy=t.clientY-rect.top-60;
  const max=38,len=Math.hypot(dx,dy)||1;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x=dx/max;joyVec.y=-dy/max;
},{passive:false});
joyEl.addEventListener('touchend',()=>{joyActive=false;joyVec.x=joyVec.y=0;knob.style.transform='translate(-50%,-50%)';});
let lookPrev=null;
$('look').addEventListener('touchstart',e=>{lookPrev={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
$('look').addEventListener('touchmove',e=>{
  if(!lookPrev||!active)return;
  const t=e.touches[0];const dx=t.clientX-lookPrev.x,dy=t.clientY-lookPrev.y;
  lookPrev={x:t.clientX,y:t.clientY};
  camera.rotation.y-=dx*.0035;
  camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x-dy*.0035,-1.35,1.35);
},{passive:true});
$('look').addEventListener('touchend',()=>{lookPrev=null;});

const dir=new THREE.Vector3(),right=new THREE.Vector3(),move=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(ready&&active){
    camera.getWorldDirection(dir);dir.y=0;dir.normalize();
    right.crossVectors(dir,THREE.Object3D.DEFAULT_UP).normalize();
    let f=Number(keys.has('KeyW')||keys.has('ArrowUp'))-Number(keys.has('KeyS')||keys.has('ArrowDown'));
    let r=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));
    if(isMobile){f+=joyVec.y;r+=joyVec.x;}
    move.set(0,0,0);
    if(f||r){move.copy(dir).multiplyScalar(f).addScaledVector(right,r);if(move.lengthSq()>0)move.normalize();move.multiplyScalar((keys.has('ShiftLeft')||keys.has('ShiftRight')?2.8:1.5)*dt);}
    camera.position.x=THREE.MathUtils.clamp(camera.position.x+move.x,bounds.minX,bounds.maxX);
    camera.position.z=THREE.MathUtils.clamp(camera.position.z+move.z,bounds.minZ,bounds.maxZ);
    camera.position.y=1.6;
  }
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
