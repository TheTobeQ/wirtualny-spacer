<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wirtualny spacer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0e; font-family: system-ui, -apple-system, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #blocker {
      position: absolute; inset: 0; background: rgba(8,8,10,0.78);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 10; cursor: pointer; text-align: center; padding: 24px;
    }
    #blocker h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); margin-bottom: 10px; font-weight: 600; letter-spacing: -0.02em; }
    #blocker p { opacity: 0.8; max-width: 400px; line-height: 1.55; font-size: 0.95rem; }
    #blocker .btn {
      margin-top: 26px; padding: 13px 30px; background: #f2f2f2; color: #111;
      border: none; border-radius: 9px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    #blocker .btn:hover { background: #fff; }
    #hud {
      position: absolute; left: 14px; bottom: 14px; color: rgba(255,255,255,0.55);
      font-size: 11px; pointer-events: none; z-index: 5; line-height: 1.4;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
      margin: -7px 0 0 -7px; pointer-events: none; z-index: 4;
      border: 1.5px solid rgba(255,255,255,0.45); border-radius: 50%;
    }
    #joystick-zone {
      position: absolute; left: 18px; bottom: 18px; width: 110px; height: 110px;
      display: none; z-index: 6; touch-action: none;
    }
    #joystick-base {
      width: 100%; height: 100%; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.22);
      position: relative;
    }
    #joystick-knob {
      position: absolute; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.4); top: 50%; left: 50%;
      transform: translate(-50%, -50%); touch-action: none;
    }
    #look-zone {
      position: absolute; right: 0; top: 0; width: 55%; height: 100%;
      display: none; z-index: 5; touch-action: none;
    }
    #loading {
      position: absolute; inset: 0; background: #0c0c0e; display: flex;
      align-items: center; justify-content: center; color: #eee; z-index: 20;
      flex-direction: column; gap: 14px; font-size: 14px;
    }
    #loading .bar {
      width: 180px; height: 3px; background: #2a2a2e; border-radius: 2px; overflow: hidden;
    }
    #loading .fill { height: 100%; width: 0%; background: #7eb8ff; transition: width 0.15s; }
  </style>
</head>
<body>
  <div id="loading">
    <div>Ładowanie…</div>
    <div class="bar"><div class="fill" id="progress"></div></div>
  </div>
  <div id="blocker">
    <h1>Wirtualny spacer</h1>
    <p>
      <strong>WASD</strong> – chodzenie &nbsp;·&nbsp; <strong>Mysz</strong> – rozglądanie<br>
      <strong>Shift</strong> – bieg &nbsp;·&nbsp; <strong>Spacja</strong> – skok<br>
      Telefon: joystick + przeciąganie
    </p>
    <button class="btn" id="startBtn">Wejdź</button>
  </div>
  <div id="crosshair"></div>
  <div id="hud">Wejście → kuchnia/salon (prawo) · łazienka · techniczne · sypialnia</div>
  <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
  <div id="look-zone"></div>
  <canvas id="canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('canvas');
    const blocker = document.getElementById('blocker');
    const startBtn = document.getElementById('startBtn');
    const loading = document.getElementById('loading');
    const progressEl = document.getElementById('progress');
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12141a);
    scene.fog = new THREE.FogExp2(0x12141a, 0.018);

    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 60);
    camera.position.set(0.3, 1.6, 4.2);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

    scene.add(new THREE.AmbientLight(0xffffff, 0.28));
    const hemi = new THREE.HemisphereLight(0xe8f0ff, 0x3a3028, 0.5);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2e0, 1.6);
    sun.position.set(5, 9, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 28;
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    const l1 = new THREE.PointLight(0xffe8c8, 1.1, 11, 1.6);
    l1.position.set(2.2, 2.3, 1.0);
    l1.castShadow = true;
    scene.add(l1);

    const l2 = new THREE.PointLight(0xe8f2ff, 0.75, 9, 1.6);
    l2.position.set(-2.0, 2.2, -1.5);
    scene.add(l2);

    const l3 = new THREE.PointLight(0xfff0d8, 0.6, 7, 1.8);
    l3.position.set(-2.5, 2.1, -3.5);
    scene.add(l3);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
    let canJump = true;
    const eyeHeight = 1.6;
    const walkSpeed = 3.8;
    const runSpeed = 6.8;

    const loader = new GLTFLoader();
    loader.load(
      'room_textured-2.glb',
      (gltf) => {
        const building = gltf.scene;
        building.traverse((c) => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
            if (c.geometry) c.geometry.computeVertexNormals();
            if (c.material) {
              c.material.side = THREE.FrontSide;
              c.material.flatShading = false;
              if (c.material.map) {
                c.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                c.material.map.colorSpace = THREE.SRGBColorSpace;
              }
              if (c.material.roughness !== undefined) {
                c.material.roughness = Math.min(1, (c.material.roughness || 0.8) + 0.05);
              }
              c.material.needsUpdate = true;
            }
          }
        });
        building.position.y = 1.51;
        scene.add(building);
        placeFurniture();
        progressEl.style.width = '100%';
        setTimeout(() => { loading.style.display = 'none'; }, 250);
      },
      (xhr) => {
        if (xhr.total) progressEl.style.width = Math.min(98, (xhr.loaded / xhr.total) * 100) + '%';
      },
      (err) => {
        console.error(err);
        loading.innerHTML = '<div style="color:#f66;text-align:center;padding:20px">Błąd ładowania modelu GLB.</div>';
      }
    );

    function M(color, rough = 0.75, metal = 0.02) {
      return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
    }

    function addBox(w, h, d, mat, x, y, z, ry = 0) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.rotation.y = ry;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }

    function addCyl(rTop, rBot, h, mat, x, y, z, seg = 16) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }

    function placeFurniture() {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(18, 18),
        new THREE.ShadowMaterial({ opacity: 0.22 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0.015;
      floor.receiveShadow = true;
      scene.add(floor);

      const fabric = M(0x3a4555, 0.88);
      const fabricLight = M(0xc8c0b4, 0.9);
      const wood = M(0x6b4e3a, 0.55, 0.08);
      const darkWood = M(0x2e2118, 0.5, 0.12);
      const white = M(0xf0efe9, 0.45);
      const counter = M(0x2a2a2c, 0.35, 0.15);
      const chrome = M(0xb0b0b8, 0.25, 0.85);
      const plantGreen = M(0x2a5a28, 0.92);

      // Living + kitchen (right)
      addBox(2.2, 0.42, 0.85, fabric, 1.6, 0.22, 0.8);
      addBox(2.2, 0.5, 0.16, fabric, 1.6, 0.68, 0.42);
      addBox(0.18, 0.35, 0.7, fabric, 0.6, 0.55, 0.75);
      addBox(0.18, 0.35, 0.7, fabric, 2.6, 0.55, 0.75);

      addBox(1.0, 0.04, 0.55, wood, 1.6, 0.36, 1.9);
      addBox(0.06, 0.32, 0.06, chrome, 1.2, 0.16, 1.7);
      addBox(0.06, 0.32, 0.06, chrome, 2.0, 0.16, 1.7);
      addBox(0.06, 0.32, 0.06, chrome, 1.2, 0.16, 2.1);
      addBox(0.06, 0.32, 0.06, chrome, 2.0, 0.16, 2.1);

      addBox(1.6, 0.45, 0.38, darkWood, 1.6, 0.23, 3.3);
      addBox(1.3, 0.75, 0.05, M(0x111111, 0.25, 0.3), 1.6, 1.05, 3.38);

      addBox(2.4, 0.88, 0.6, white, 3.3, 0.44, -0.8);
      addBox(2.4, 0.035, 0.6, counter, 3.3, 0.9, -0.8);
      addCyl(0.18, 0.18, 0.08, chrome, 3.8, 0.94, -0.8, 20);

      addBox(1.3, 0.04, 0.8, wood, 3.0, 0.74, 1.5);
      [[2.5, 1.2], [3.5, 1.2], [2.5, 1.8], [3.5, 1.8]].forEach(([x, z]) => {
        addBox(0.05, 0.7, 0.05, wood, x, 0.35, z);
      });
      [[2.4, 1.0], [3.6, 1.0], [2.4, 2.0], [3.6, 2.0]].forEach(([x, z]) => {
        addBox(0.4, 0.06, 0.4, fabric, x, 0.42, z);
        addBox(0.4, 0.4, 0.05, fabric, x, 0.65, z - 0.18);
      });

      // Bedroom (top-left)
      addBox(1.7, 0.32, 2.0, fabric, -2.6, 0.18, -3.4);
      addBox(1.7, 0.12, 0.35, fabricLight, -2.6, 0.42, -4.2);
      addBox(0.55, 0.1, 0.35, fabricLight, -3.1, 0.42, -3.6);
      addBox(0.55, 0.1, 0.35, fabricLight, -2.1, 0.42, -3.6);
      addBox(0.4, 0.42, 0.35, darkWood, -3.7, 0.22, -4.1);
      addBox(0.4, 0.42, 0.35, darkWood, -1.5, 0.22, -4.1);
      addBox(1.1, 2.1, 0.5, white, -0.3, 1.05, -4.3);

      // Bathroom (bottom-left)
      addBox(0.7, 0.55, 0.45, white, -3.0, 0.28, 2.8);
      addCyl(0.28, 0.28, 0.12, chrome, -3.0, 0.58, 2.8, 20);
      addBox(0.7, 0.04, 0.45, counter, -3.0, 0.57, 2.8);

      // Technical
      addBox(0.9, 1.6, 0.55, M(0x3a3a3e, 0.6), -3.2, 0.8, 0.2);

      // Plant
      addCyl(0.16, 0.14, 0.35, M(0x4a3728, 0.85), 3.6, 0.18, 3.0);
      const foliage = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 8), plantGreen);
      foliage.position.set(3.6, 0.65, 3.0);
      foliage.castShadow = true;
      scene.add(foliage);

      const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.0), M(0x5c4030, 0.95));
      rug.rotation.x = -Math.PI / 2;
      rug.position.set(1.6, 0.02, 1.4);
      rug.receiveShadow = true;
      scene.add(rug);
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') keys.w = true;
      if (e.code === 'KeyA') keys.a = true;
      if (e.code === 'KeyS') keys.s = true;
      if (e.code === 'KeyD') keys.d = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
      if (e.code === 'Space') { keys.space = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') keys.w = false;
      if (e.code === 'KeyA') keys.a = false;
      if (e.code === 'KeyS') keys.s = false;
      if (e.code === 'KeyD') keys.d = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
      if (e.code === 'Space') keys.space = false;
    });

    startBtn.addEventListener('click', () => {
      if (isMobile) {
        blocker.style.display = 'none';
        document.getElementById('joystick-zone').style.display = 'block';
        document.getElementById('look-zone').style.display = 'block';
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } else {
        controls.lock();
      }
    });
    controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
    controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

    let joyActive = false, joyVec = { x: 0, y: 0 };
    const knob = document.getElementById('joystick-knob');
    const joyZone = document.getElementById('joystick-zone');
    const lookZone = document.getElementById('look-zone');

    joyZone.addEventListener('touchstart', (e) => { e.preventDefault(); joyActive = true; }, { passive: false });
    joyZone.addEventListener('touchmove', (e) => {
      if (!joyActive) return;
      e.preventDefault();
      const t = e.touches[0];
      const rect = joyZone.getBoundingClientRect();
      let dx = t.clientX - rect.left - 55;
      let dy = t.clientY - rect.top - 55;
      const max = 36;
      const len = Math.hypot(dx, dy) || 1;
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joyVec.x = dx / max;
      joyVec.y = -dy / max;
    }, { passive: false });
    joyZone.addEventListener('touchend', () => {
      joyActive = false; joyVec.x = joyVec.y = 0;
      knob.style.transform = 'translate(-50%, -50%)';
    });

    let lookPrev = null;
    lookZone.addEventListener('touchstart', (e) => {
      lookPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    lookZone.addEventListener('touchmove', (e) => {
      if (!lookPrev) return;
      const t = e.touches[0];
      const dx = t.clientX - lookPrev.x;
      const dy = t.clientY - lookPrev.y;
      lookPrev = { x: t.clientX, y: t.clientY };
      const euler = new THREE.Euler(0, 0, 0, 'YXZ');
      euler.setFromQuaternion(camera.quaternion);
      euler.y -= dx * 0.0038;
      euler.x -= dy * 0.0038;
      euler.x = Math.max(-1.4, Math.min(1.4, euler.x));
      camera.quaternion.setFromEuler(euler);
    }, { passive: true });
    lookZone.addEventListener('touchend', () => { lookPrev = null; });

    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const dt = Math.min(0.05, (time - prevTime) / 1000);
      prevTime = time;

      if (controls.isLocked || isMobile) {
        velocity.x -= velocity.x * 9.0 * dt;
        velocity.z -= velocity.z * 9.0 * dt;
        velocity.y -= 22 * dt;

        direction.z = Number(keys.w) - Number(keys.s);
        direction.x = Number(keys.d) - Number(keys.a);
        if (isMobile) {
          direction.z += joyVec.y;
          direction.x += joyVec.x;
        }
        direction.normalize();

        const speed = keys.shift ? runSpeed : walkSpeed;
        if (keys.w || keys.s || Math.abs(joyVec.y) > 0.04) velocity.z -= direction.z * speed * 14 * dt;
        if (keys.a || keys.d || Math.abs(joyVec.x) > 0.04) velocity.x -= direction.x * speed * 14 * dt;

        if (keys.space && canJump) {
          velocity.y = 6.2;
          canJump = false;
        }

        controls.moveRight(-velocity.x * dt);
        controls.moveForward(-velocity.z * dt);
        controls.getObject().position.y += velocity.y * dt;

        if (controls.getObject().position.y < eyeHeight) {
          velocity.y = 0;
          controls.getObject().position.y = eyeHeight;
          canJump = true;
        }

        const p = controls.getObject().position;
        p.x = THREE.MathUtils.clamp(p.x, -4.3, 4.3);
        p.z = THREE.MathUtils.clamp(p.z, -5.2, 5.2);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.body.addEventListener('touchmove', e => {
      if (e.target.closest('#joystick-zone,#look-zone')) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
